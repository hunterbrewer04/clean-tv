name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships an Android SDK (ANDROID_HOME); Gradle fetches anything missing.
      - name: Unit tests, lint, unsigned release build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -S warning -P SCRIPTDIR:profiles:scripts scripts/*.sh profiles/*.sh
